<div class="container">
  <div class="container text-center style" style="margin:30px">
    <h3>Sistema de Inventarios Galeria Arte Marcos</h3>
  </div>

  <table class="table table-striped table-hover align-middle">
    <thead>
      <tr>
        <th scope="col">Id</th>
        <th scope="col">Descripción del Producto</th>
        <th scope="col">Precio</th>
        <th scope="col">Existencias (stock)</th>
        <th scope="col" class="text-center">Acciones</th>
      </tr>
    </thead>
    <tbody>
      @for (producto of productos; track producto.idProducto) {
        <tr>
          <th scope="row">{{ producto.idProducto }}</th>
          <td>{{ producto.descripcion }}</td>
          <td>{{ producto.precio }}</td>
          <td>{{ producto.existencia }}</td>
           <td class="text-center">
             <div>
              <button (click)="editarProducto(producto.idProducto)"
               class="btn btn-warning btn-sm me-3">Actualizar</button>
               <button (click)="eliminarProducto(producto.idProducto)"
                     class="btn btn-danger btn-sm">Eliminar</button>
             </div>
           </td>
        </tr>
      }
    </tbody>
  </table>
</div>
